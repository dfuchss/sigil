name: Sigil
options:
  bundleIdPrefix: org.fuchss
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  # DEVELOPMENT_TEAM comes from Config/Local.xcconfig (git-ignored), see Config/Local.xcconfig.example.
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  SigilCore:
    path: SigilCore

settings:
  configs:
    # One setting drives every identity: bundle IDs, App Group, Mach service, LaunchAgent plist name. Debug builds
    # get their own identity so they never clash with the installed release copy in /Applications.
    Debug:
      SIGIL_BUNDLE_PREFIX: org.fuchss.sigil.dev
      SIGIL_DISPLAY_NAME: Sigil Dev
      SIGIL_EXTENSION_NAME: Sigil Dev OpenPGP
    Release:
      SIGIL_BUNDLE_PREFIX: org.fuchss.sigil
      SIGIL_DISPLAY_NAME: Sigil
      SIGIL_EXTENSION_NAME: Sigil OpenPGP
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO

targets:
  Sigil:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      # The GPL text, shown by the About window's license view.
      - path: LICENSE
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleName: $(SIGIL_DISPLAY_NAME)
        CFBundleDisplayName: $(SIGIL_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        SigilHelperPlistName: $(SIGIL_BUNDLE_PREFIX).helper.plist
        SigilBundlePrefix: $(SIGIL_BUNDLE_PREFIX)
        SigilAppGroup: $(TeamIdentifierPrefix)$(SIGIL_BUNDLE_PREFIX)
        SigilMachServiceName: $(TeamIdentifierPrefix)$(SIGIL_BUNDLE_PREFIX).helper
    entitlements:
      # Not sandboxed: BTM refuses to register an unsandboxed SMAppService agent (SigilHelper) for a
      # sandboxed app ("SMAppService target executable must be sandboxed because the app is sandboxed").
      # The Mail extension stays sandboxed.
      path: App/Sigil.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(SIGIL_BUNDLE_PREFIX)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SIGIL_BUNDLE_PREFIX)
        PRODUCT_NAME: $(SIGIL_DISPLAY_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SigilCore
      - target: SigilExtension
        embed: true
        codeSign: true
      - target: SigilHelper
        embed: false
        link: false
    postCompileScripts:
      # SigilHelper is a tool target, so XcodeGen cannot copy its product with a copy-files
      # phase; copy it into Contents/MacOS and sign it (hardened runtime) when signing is on, keeping the
      # entitlements Xcode signed the tool with (App Group).
      - name: Embed SigilHelper
        basedOnDependencyAnalysis: false
        script: |
          set -e
          DEST="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}"
          mkdir -p "$DEST"
          cp -f "${BUILT_PRODUCTS_DIR}/SigilHelper" "$DEST/SigilHelper"
          if [ "${CODE_SIGNING_ALLOWED}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY}" ]; then
            /usr/bin/codesign --force --options runtime --preserve-metadata=entitlements --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "$DEST/SigilHelper"
          fi
    postBuildScripts:
      # Generate the LaunchAgent plist (named after the prefix) from Helper/helper.plist.template.
      - name: Generate LaunchAgent plist
        basedOnDependencyAnalysis: false
        script: |
          set -e
          DIR="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Library/LaunchAgents"
          mkdir -p "$DIR"
          /usr/bin/sed -e "s|__TEAM__|${TeamIdentifierPrefix}|g" -e "s|__PREFIX__|${SIGIL_BUNDLE_PREFIX}|g" \
            "${SRCROOT}/Helper/helper.plist.template" > "$DIR/${SIGIL_BUNDLE_PREFIX}.helper.plist"

  SigilExtension:
    type: app-extension
    platform: macOS
    sources: [Extension, Shared]
    info:
      path: Extension/Info.plist
      properties:
        CFBundleName: $(SIGIL_EXTENSION_NAME)
        CFBundleDisplayName: $(SIGIL_EXTENSION_NAME)
        NSHumanReadableDescription: Signs, encrypts, decrypts and verifies mail with OpenPGP using your own GnuPG.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SigilBundlePrefix: $(SIGIL_BUNDLE_PREFIX)
        SigilAppGroup: $(TeamIdentifierPrefix)$(SIGIL_BUNDLE_PREFIX)
        SigilMachServiceName: $(TeamIdentifierPrefix)$(SIGIL_BUNDLE_PREFIX).helper
        NSExtension:
          NSExtensionPointIdentifier: com.apple.email.extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MailExtension
          NSExtensionAttributes:
            MEExtensionCapabilities:
              - MEMessageSecurityHandler
              - MEComposeSessionHandler
    entitlements:
      path: Extension/SigilExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(SIGIL_BUNDLE_PREFIX)
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(TeamIdentifierPrefix)$(SIGIL_BUNDLE_PREFIX).helper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SIGIL_BUNDLE_PREFIX).extension
        PRODUCT_NAME: SigilExtension
        SKIP_INSTALL: YES
    dependencies:
      - package: SigilCore

  SigilHelper:
    type: tool
    platform: macOS
    sources:
      - Helper/main.swift
      - Helper/ListenerDelegate.swift
    info:
      path: Helper/Info.plist
      properties:
        CFBundleName: SigilHelper
        CFBundleIdentifier: $(SIGIL_BUNDLE_PREFIX).helper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Expanded at build time, so the team prefix is correct once a team is set.
        SigilBundlePrefix: $(SIGIL_BUNDLE_PREFIX)
        SigilAppGroup: $(TeamIdentifierPrefix)$(SIGIL_BUNDLE_PREFIX)
        SigilMachServiceName: $(TeamIdentifierPrefix)$(SIGIL_BUNDLE_PREFIX).helper
    entitlements:
      # Intentionally not sandboxed. The App Group lets UserDefaults(suiteName:) read the app's shared settings.
      path: Helper/SigilHelper.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(SIGIL_BUNDLE_PREFIX)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SIGIL_BUNDLE_PREFIX).helper
        PRODUCT_NAME: SigilHelper
        SKIP_INSTALL: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_FILE: Helper/Info.plist
    dependencies:
      - package: SigilCore
